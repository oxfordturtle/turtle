name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task fmt:check
      - run: deno task coverage:check
      - run: deno task test:examples
      - run: deno task build
      - run: deno run -A npm:playwright-core@1.49 install --with-deps chromium
      - run: deno task test:ui:browser
